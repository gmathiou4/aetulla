# versions.lock — the tested ("known-good") version set. Plain KEY=VALUE, no quotes, no spaces:
# it is passed to docker compose as an extra --env-file by `aetulla update --channel locked`.
# Values here MUST equal the ${VAR:-default} fallbacks in docker-compose.yml
# (tests/lock_defaults_test.sh checks that). Never edit by hand during an update run:
# `aetulla update` writes the resolved result to ~/.aetulla/resolved.lock, and
# `aetulla lock --promote` copies a fully healthy one here.

